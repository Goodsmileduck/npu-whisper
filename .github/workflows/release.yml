name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false  # uv build runs build-backend code

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check the tag matches __version__
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}  # via env, never interpolated into the script
        run: |
          $version = (Select-String -Path debora_whisper/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) {
            Write-Error "Tag $env:TAG does not match __version__ $version"
            exit 1
          }

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test the installed commands
        shell: pwsh
        run: |
          uv tool install --python 3.12 (Get-ChildItem dist/*.whl).FullName
          debora-cli --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          debora --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/debora-whisper
    permissions:
      id-token: write  # trusted publishing; no API token is stored
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
